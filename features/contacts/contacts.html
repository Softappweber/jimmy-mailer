<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jimmy Mailer - Contacts</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .contacts-page {
            max-width: 1200px;
            margin: 0 auto;
        }

        .contacts-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px;
        }

        .contacts-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .contacts-header p {
            margin: 7px 0 0;
            color: #687386;
        }

        .primary-button {
            border: none;
            background: #2563eb;
            color: #ffffff;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        .secondary-button {
            border: 1px solid #d5dbe5;
            background: #ffffff;
            color: #374151;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .secondary-button:hover {
            background: #f8fafc;
        }

        .contacts-card {
            background: #ffffff;
            border: 1px solid #e5e9f0;
            border-radius: 12px;
            overflow: hidden;
        }

        .contacts-toolbar {
            padding: 20px;
            border-bottom: 1px solid #e5e9f0;
        }

        .toolbar-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #contactSearch {
            flex: 1;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5dbe5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        #contactSearch:focus {
            border-color: #2563eb;
        }

        .contact-count {
            padding: 15px 20px;
            color: #687386;
            font-size: 14px;
            border-bottom: 1px solid #e5e9f0;
        }

        .contact-table {
            width: 100%;
            border-collapse: collapse;
        }

        .contact-table th,
        .contact-table td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid #eef1f5;
        }

        .contact-table th {
            font-size: 13px;
            color: #4b5563;
            background: #f8fafc;
        }

        .contact-table td {
            font-size: 14px;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state strong {
            display: block;
            font-size: 17px;
            margin-bottom: 8px;
        }

        .empty-state p {
            margin: 0;
            color: #687386;
        }

        .error-message {
            padding: 20px;
            color: #b91c1c;
            background: #fef2f2;
            border-top: 1px solid #fecaca;
        }

        .success-message {
            padding: 15px 20px;
            color: #166534;
            background: #f0fdf4;
            border-bottom: 1px solid #bbf7d0;
            font-size: 14px;
        }

        .loading {
            padding: 40px 20px;
            text-align: center;
            color: #687386;
        }

        /* =====================================================
           ADD CONTACT FORM
        ====================================================== */

        .add-contact-card {
            background: #ffffff;
            border: 1px solid #e5e9f0;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .add-contact-header {
            padding: 20px;
            border-bottom: 1px solid #e5e9f0;
        }

        .add-contact-header h2 {
            margin: 0;
            font-size: 19px;
        }

        .add-contact-header p {
            margin: 6px 0 0;
            color: #687386;
            font-size: 14px;
        }

        .contact-form {
            padding: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .form-field input {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #d5dbe5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .form-field input:focus {
            border-color: #2563eb;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .form-message {
            margin-top: 15px;
            font-size: 14px;
        }

        .form-message.error {
            color: #b91c1c;
        }

        .form-message.success {
            color: #166534;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 800px) {

            body {
                padding: 15px;
            }

            .contacts-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .toolbar-row {
                flex-direction: column;
                align-items: stretch;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .contact-table {
                display: block;
                overflow-x: auto;
            }

        }

    </style>

</head>


<body>

    <div class="contacts-page">

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="contacts-header">

            <div>

                <h1>
                    Contacts
                </h1>

                <p>
                    Manage the people on your mailing list.
                </p>

            </div>


            <button
                type="button"
                id="addContactButton"
                class="primary-button"
            >
                + Add Contact
            </button>

        </div>


        <!-- =====================================================
             ADD CONTACT FORM
        ====================================================== -->

        <div
            id="addContactCard"
            class="add-contact-card hidden"
        >

            <div class="add-contact-header">

                <h2>
                    Add Contact
                </h2>

                <p>
                    Add a new person to your mailing list.
                </p>

            </div>


            <form
                id="contactForm"
                class="contact-form"
            >

                <div class="form-grid">

                    <div class="form-field">

                        <label for="contactName">
                            Name
                        </label>

                        <input
                            type="text"
                            id="contactName"
                            placeholder="John Smith"
                        >

                    </div>


                    <div class="form-field">

                        <label for="contactEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="contactEmail"
                            placeholder="john@example.com"
                            required
                        >

                    </div>


                    <div class="form-field">

                        <label for="contactCompany">
                            Company
                        </label>

                        <input
                            type="text"
                            id="contactCompany"
                            placeholder="Company name"
                        >

                    </div>

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="primary-button"
                        id="saveContactButton"
                    >
                        Save Contact
                    </button>

                    <button
                        type="button"
                        class="secondary-button"
                        id="cancelContactButton"
                    >
                        Cancel
                    </button>

                </div>


                <div
                    id="formMessage"
                    class="form-message"
                ></div>

            </form>

        </div>


        <!-- =====================================================
             CONTACTS CARD
        ====================================================== -->

        <div class="contacts-card">

            <div class="contacts-toolbar">

                <div class="toolbar-row">

                    <input
                        type="search"
                        id="contactSearch"
                        placeholder="Search contacts by name, email or company..."
                        autocomplete="off"
                    >

                </div>

            </div>


            <div
                id="contactCount"
                class="contact-count"
            >
                Loading contacts...
            </div>


            <div id="contactsContent">

                <div class="loading">
                    Loading contacts...
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // =====================================================
        // SUPABASE CONFIGURATION
        // =====================================================

        const SUPABASE_URL =
            'https://noqomcunnjpseckfwexq.supabase.co';

        const SUPABASE_PUBLISHABLE_KEY =
            'sb_publishable_JEy64MEHECql-Om23gaqdA_TEcl3T5O';


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // =====================================================
        // DOM
        // =====================================================

        const contactsContent =
            document.getElementById('contactsContent');

        const contactCount =
            document.getElementById('contactCount');

        const contactSearch =
            document.getElementById('contactSearch');

        const addContactButton =
            document.getElementById('addContactButton');

        const addContactCard =
            document.getElementById('addContactCard');

        const contactForm =
            document.getElementById('contactForm');

        const cancelContactButton =
            document.getElementById('cancelContactButton');

        const saveContactButton =
            document.getElementById('saveContactButton');

        const formMessage =
            document.getElementById('formMessage');

        const contactName =
            document.getElementById('contactName');

        const contactEmail =
            document.getElementById('contactEmail');

        const contactCompany =
            document.getElementById('contactCompany');


        let contacts = [];


        // =====================================================
        // CURRENT USER
        // =====================================================

        let currentUser = null;


        // =====================================================
        // SHOW FORM
        // =====================================================

        addContactButton.addEventListener(
            'click',
            () => {

                addContactCard.classList.remove('hidden');

                formMessage.textContent = '';
                formMessage.className = 'form-message';

                contactName.focus();

            }
        );


        // =====================================================
        // HIDE FORM
        // =====================================================

        cancelContactButton.addEventListener(
            'click',
            () => {

                contactForm.reset();

                formMessage.textContent = '';
                formMessage.className = 'form-message';

                addContactCard.classList.add('hidden');

            }
        );


        // =====================================================
        // LOAD CURRENT USER
        // =====================================================

        async function getCurrentUser() {

            const {
                data: { user },
                error
            } =
                await supabaseClient.auth.getUser();


            if (error) {
                throw error;
            }


            if (!user) {

                throw new Error(
                    'No authenticated user found. Please log in to Jimmy Mailer first.'
                );

            }


            currentUser = user;

            return user;

        }


        // =====================================================
        // LOAD CONTACTS
        // =====================================================

        async function loadContacts() {

            contactsContent.innerHTML = `
                <div class="loading">
                    Loading contacts...
                </div>
            `;

            try {

                const user =
                    currentUser ||
                    await getCurrentUser();


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .from('contacts')
                        .select(
                            'id, name, email, company, status, created_at'
                        )
                        .eq(
                            'user_id',
                            user.id
                        )
                        .order(
                            'created_at',
                            {
                                ascending: false
                            }
                        );


                if (error) {
                    throw error;
                }


                contacts = data || [];

                renderContacts(contacts);


            } catch (error) {

                console.error(
                    'Contacts loading error:',
                    error
                );


                contactCount.textContent =
                    'Unable to load contacts';


                contactsContent.innerHTML = `
                    <div class="error-message">
                        ${escapeHtml(
                            error.message ||
                            'Unable to load contacts.'
                        )}
                    </div>
                `;

            }

        }


        // =====================================================
        // ADD CONTACT
        // =====================================================

        contactForm.addEventListener(
            'submit',
            async (event) => {

                event.preventDefault();


                formMessage.textContent = '';
                formMessage.className =
                    'form-message';


                saveContactButton.disabled = true;

                saveContactButton.textContent =
                    'Saving...';


                try {

                    const user =
                        currentUser ||
                        await getCurrentUser();


                    const name =
                        contactName.value
                            .trim();

                    const email =
                        contactEmail.value
                            .trim()
                            .toLowerCase();

                    const company =
                        contactCompany.value
                            .trim();


                    if (!email) {

                        throw new Error(
                            'Email address is required.'
                        );

                    }


                    // =================================================
                    // CHECK FOR DUPLICATE EMAIL
                    // =================================================

                    const {
                        data: existingContact,
                        error: duplicateError
                    } =
                        await supabaseClient
                            .from('contacts')
                            .select('id')
                            .eq(
                                'user_id',
                                user.id
                            )
                            .eq(
                                'email',
                                email
                            )
                            .maybeSingle();


                    if (duplicateError) {
                        throw duplicateError;
                    }


                    if (existingContact) {

                        throw new Error(
                            'A contact with this email address already exists.'
                        );

                    }


                    // =================================================
                    // INSERT CONTACT
                    // =================================================

                    const {
                        data,
                        error
                    } =
                        await supabaseClient
                            .from('contacts')
                            .insert({

                                user_id: user.id,

                                name:
                                    name || null,

                                email: email,

                                company:
                                    company || null,

                                status: 'active'

                            })
                            .select(
                                'id, name, email, company, status, created_at'
                            )
                            .single();


                    if (error) {
                        throw error;
                    }


                    // Add new contact to local list

                    contacts.unshift(data);


                    // Refresh displayed list

                    renderContacts(contacts);


                    // Clear form

                    contactForm.reset();


                    formMessage.textContent =
                        'Contact added successfully.';

                    formMessage.className =
                        'form-message success';


                    // Close form after successful save

                    setTimeout(() => {

                        addContactCard.classList.add(
                            'hidden'
                        );

                        formMessage.textContent = '';
                        formMessage.className =
                            'form-message';

                    }, 1000);


                } catch (error) {

                    console.error(
                        'Add contact error:',
                        error
                    );


                    formMessage.textContent =
                        error.message ||
                        'Unable to add contact.';

                    formMessage.className =
                        'form-message error';


                } finally {

                    saveContactButton.disabled =
                        false;

                    saveContactButton.textContent =
                        'Save Contact';

                }

            }
        );


        // =====================================================
        // RENDER CONTACTS
        // =====================================================

        function renderContacts(list) {

            contactCount.textContent =
                `${list.length} contact${list.length === 1 ? '' : 's'}`;


            if (!list.length) {

                contactsContent.innerHTML = `

                    <div class="empty-state">

                        <strong>
                            No contacts yet
                        </strong>

                        <p>
                            Your Supabase contacts will appear here.
                        </p>

                    </div>

                `;

                return;
            }


            let rows = '';


            list.forEach(contact => {

                rows += `

                    <tr>

                        <td>
                            ${escapeHtml(
                                contact.name || '—'
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                contact.email
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                contact.company || '—'
                            )}
                        </td>

                        <td>
                            ${escapeHtml(
                                contact.status || 'active'
                            )}
                        </td>

                    </tr>

                `;

            });


            contactsContent.innerHTML = `

                <table class="contact-table">

                    <thead>

                        <tr>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Company
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        ${rows}

                    </tbody>

                </table>

            `;

        }


        // =====================================================
        // SEARCH
        // =====================================================

        contactSearch.addEventListener(
            'input',
            () => {

                const search =
                    contactSearch.value
                        .trim()
                        .toLowerCase();


                if (!search) {

                    renderContacts(contacts);

                    return;

                }


                const filtered =
                    contacts.filter(contact => {

                        return (

                            (contact.name || '')
                                .toLowerCase()
                                .includes(search)

                            ||

                            (contact.email || '')
                                .toLowerCase()
                                .includes(search)

                            ||

                            (contact.company || '')
                                .toLowerCase()
                                .includes(search)

                        );

                    });


                renderContacts(filtered);

            }
        );


        // =====================================================
        // HTML ESCAPING
        // =====================================================

        function escapeHtml(value) {

            const div =
                document.createElement('div');

            div.textContent =
                String(value);

            return div.innerHTML;

        }


        // =====================================================
        // START
        // =====================================================

        async function startContactsPage() {

            try {

                await getCurrentUser();

                await loadContacts();

            } catch (error) {

                console.error(
                    'Contacts startup error:',
                    error
                );


                contactCount.textContent =
                    'Unable to load contacts';


                contactsContent.innerHTML = `
                    <div class="error-message">
                        ${escapeHtml(
                            error.message ||
                            'Unable to load contacts.'
                        )}
                    </div>
                `;

            }

        }


        startContactsPage();

    </script>

</body>

</html>
