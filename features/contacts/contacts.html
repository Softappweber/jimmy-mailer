<section class="contacts-module">

    <div class="contacts-module-header">

        <div>
            <h2>Contacts</h2>
            <p>
                Manage your mailing contacts.
            </p>
        </div>

        <div class="contacts-module-actions">

            <span id="contactCount">
                0 contacts
            </span>

            <button
                type="button"
                id="addContactButton"
            >
                Add Contact
            </button>

        </div>

    </div>


    <div
        id="contactsList"
        class="contacts-list"
    >

        <div class="contacts-empty">

            <strong>
                No contacts yet
            </strong>

            <p>
                Your contacts will appear here.
            </p>

        </div>

    </div>

</section>
