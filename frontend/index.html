<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jimmy Mailer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loginScreen" class="auth-screen">

        <div class="auth-card">

            <div class="brand">
                <div class="brand-logo">JM</div>
                <h1>Jimmy Mailer</h1>
                <p>Smart List Mailing</p>
            </div>

            <!-- SIGN IN -->
            <div id="loginBox">

                <h2>Sign In</h2>

                <form id="loginForm">

                    <label for="loginEmail">Email</label>
                    <input
                        type="email"
                        id="loginEmail"
                        required
                        autocomplete="email"
                    >

                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        required
                        autocomplete="current-password"
                    >

                    <button type="submit" id="loginButton">
                        SIGN IN
                    </button>

                </form>

                <p class="switch-auth">
                    Don't have an account?
                    <button type="button" id="showSignup">
                        Sign Up
                    </button>
                </p>

            </div>


            <!-- SIGN UP -->
            <div id="signupBox" class="hidden">

                <h2>Create Account</h2>

                <form id="signupForm">

                    <label for="signupName">Name</label>
                    <input
                        type="text"
                        id="signupName"
                        required
                        autocomplete="name"
                    >

                    <label for="signupEmail">Email</label>
                    <input
                        type="email"
                        id="signupEmail"
                        required
                        autocomplete="email"
                    >

                    <label for="signupPassword">Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >

                    <button type="submit" id="signupButton">
                        CREATE ACCOUNT
                    </button>

                </form>

                <p class="switch-auth">
                    Already have an account?
                    <button type="button" id="showLogin">
                        Sign In
                    </button>
                </p>

            </div>

        </div>

    </div>


    <!-- APP -->
    <div id="app" class="app hidden">

        <header class="app-header">
            <div>
                <strong>Jimmy Mailer</strong>
            </div>

            <div>
                <span id="userEmail"></span>
                <button id="logoutButton">Logout</button>
            </div>
        </header>

        <main class="app-content">

            <h1>Dashboard</h1>

            <div class="welcome-card">
                <h2>Welcome to Jimmy Mailer</h2>
                <p>
                    Your account is successfully connected.
                </p>
            </div>

        </main>

    </div>


    <!-- LOADING -->
    <div id="loadingOverlay" class="loading hidden">
        <div class="spinner"></div>
        <p>Please wait...</p>
    </div>


    <!-- TOAST -->
    <div id="toastContainer"></div>


    <script src="app.js"></script>

</body>
</html>
